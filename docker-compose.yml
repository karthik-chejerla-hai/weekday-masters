services:
  postgres:
    image: postgres:16-alpine
    container_name: rally-db
    environment:
      POSTGRES_USER: badminton
      POSTGRES_PASSWORD: badminton123
      POSTGRES_DB: badminton_club
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badminton -d badminton_club"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot schema migration. The API server no longer migrates on startup.
  migrate:
    build:
      context: ./backend
    container_name: rally-migrate
    command: ["./migrate"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://badminton:badminton123@postgres:5432/badminton_club?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: rally-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://badminton:badminton123@postgres:5432/badminton_club?sslmode=disable
      FRONTEND_URL: http://localhost:5173
      GIN_MODE: debug
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    image: node:20-alpine
    container_name: rally-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8080/api
    env_file:
      - ./frontend/.env
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
