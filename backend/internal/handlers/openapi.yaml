openapi: 3.0.3
info:
  title: RallyUp API
  description: RallyUp Badminton Club management API — member registration, session scheduling, RSVP tracking, and notifications.
  version: 1.0.0

servers:
  - url: /api
    description: API root

tags:
  - name: Public
    description: No authentication required
  - name: Users
    description: User profile and member listing
  - name: Sessions
    description: Session listing and details
  - name: RSVP
    description: RSVP management
  - name: Notifications
    description: Notification preferences, push tokens, and history
  - name: "Admin: Members"
    description: Admin member management
  - name: "Admin: Sessions"
    description: Admin session management
  - name: "Admin: Club"
    description: Admin club settings
  - name: "Admin: Announcements"
    description: Admin announcements

security:
  - bearerAuth: []

paths:
  /club:
    get:
      tags: [Public]
      summary: Get club information
      operationId: getClub
      security: []
      responses:
        "200":
          description: Club info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Club"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      operationId: getMe
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Users]
      summary: Update current user profile
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users:
    get:
      tags: [Users]
      summary: List approved club members
      description: Requires approved membership.
      operationId: listMembers
      responses:
        "200":
          description: List of approved members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/me/notifications:
    get:
      tags: [Notifications]
      summary: Get notification preferences
      operationId: getNotificationPreferences
      responses:
        "200":
          description: Notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNotificationPreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Notifications]
      summary: Update notification preferences
      operationId: updateNotificationPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesRequest"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNotificationPreferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/push-tokens:
    post:
      tags: [Notifications]
      summary: Register FCM push token
      operationId: registerPushToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterTokenRequest"
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Notifications]
      summary: Unregister FCM push token
      description: If token is omitted, all tokens for the user are removed.
      operationId: unregisterPushToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnregisterTokenRequest"
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/notifications/history:
    get:
      tags: [Notifications]
      summary: Get notification history
      operationId: getNotificationHistory
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Notification list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark notification as read
      operationId: markNotificationRead
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions:
    get:
      tags: [Sessions]
      summary: List upcoming sessions
      description: Requires approved membership.
      operationId: listSessions
      responses:
        "200":
          description: List of upcoming sessions (with RSVPs preloaded)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /sessions/cancelled:
    get:
      tags: [Sessions]
      summary: List upcoming cancelled sessions
      description: Requires approved membership.
      operationId: listCancelledSessions
      responses:
        "200":
          description: List of cancelled sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /sessions/{id}:
    get:
      tags: [Sessions]
      summary: Get session details with RSVP summary
      description: Requires approved membership.
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session with RSVP summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
                  rsvp_summary:
                    $ref: "#/components/schemas/RSVPSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{id}/rsvp:
    post:
      tags: [RSVP]
      summary: Create RSVP for a session
      description: Requires approved membership. Subject to 3-day deadline enforcement.
      operationId: createRSVP
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RSVPRequest"
      responses:
        "200":
          description: RSVP created/updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RSVP"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [RSVP]
      summary: Update RSVP for a session
      description: Requires approved membership. After deadline, IN cannot be changed to OUT.
      operationId: updateRSVP
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RSVPRequest"
      responses:
        "200":
          description: RSVP updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RSVP"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [RSVP]
      summary: Remove RSVP from a session
      description: Requires approved membership.
      operationId: deleteRSVP
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions/{id}/rsvp/me:
    get:
      tags: [RSVP]
      summary: Get current user's RSVP for a session
      description: Requires approved membership.
      operationId: getMyRSVP
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: User's RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RSVP"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/join-requests:
    get:
      tags: ["Admin: Members"]
      summary: List pending join requests
      operationId: listJoinRequests
      responses:
        "200":
          description: List of pending users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/join-requests/{id}/approve:
    post:
      tags: ["Admin: Members"]
      summary: Approve a join request
      operationId: approveJoinRequest
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Approved user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/join-requests/{id}/reject:
    post:
      tags: ["Admin: Members"]
      summary: Reject a join request
      operationId: rejectJoinRequest
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Rejected user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users:
    get:
      tags: ["Admin: Members"]
      summary: List every member, whatever their status
      description: >
        The admin's view of the roll. Unlike `GET /users`, which is the club's
        list of approved members, this includes pending, rejected and removed
        rows, because those are what an admin acts on.
      operationId: adminListMembers
      responses:
        "200":
          description: Every user row
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: ["Admin: Members"]
      summary: Invite a member who has not signed up yet
      description: >
        Creates an approved member ahead of their first sign-in. Sign-in is
        Google OAuth, so there is no account to create on their behalf; what this
        row does is reserve the identity, carrying the membership, the role and a
        ledger account. The member is chargeable immediately — they can be RSVP'd
        into sessions and settled against. When they first sign in with a
        verified email matching this one, `POST /auth/callback` adopts the row
        rather than creating a second one, so they arrive already approved.


        No email is sent; tell them to sign in however you normally reach them.
      operationId: inviteMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberRequest"
      responses:
        "201":
          description: The invited member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users/{id}:
    put:
      tags: ["Admin: Members"]
      summary: Update a member's details
      description: >
        Omitted fields are left alone, so the form can send only what changed.


        `email` is editable only while the row is still an unclaimed invite. Once
        a real Auth0 subject is bound to it, the address belongs to the identity
        provider: changing it here would not change how they sign in, and would
        silently move them in or out of the ADMIN_EMAIL auto-promotion rule.
      operationId: updateMember
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
      responses:
        "200":
          description: The updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No member with that id
    delete:
      tags: ["Admin: Members"]
      summary: Remove a member from the club
      description: >
        Revokes access by setting `membership_status` to `removed`. This is not a
        delete — the row and its ledger history stay, and `POST
        /admin/users/{id}/reinstate` undoes it.


        Refused with 400 when the member still has a non-zero balance (settle up
        with a top-up or withdrawal first), when they are the club's only admin,
        or when they are the caller. Their RSVPs for upcoming sessions are
        cancelled, promoting anyone waiting behind them.
      operationId: removeMember
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The removed member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No member with that id

  /admin/users/{id}/reinstate:
    post:
      tags: ["Admin: Members"]
      summary: Return a removed member to the club
      operationId: reinstateMember
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The reinstated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No member with that id

  /admin/users/{id}/role:
    put:
      tags: ["Admin: Members"]
      summary: Update a user's role
      operationId: updateUserRole
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/sessions:
    post:
      tags: ["Admin: Sessions"]
      summary: Create a session
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/sessions/{id}:
    put:
      tags: ["Admin: Sessions"]
      summary: Update a session
      operationId: updateSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionRequest"
      responses:
        "200":
          description: Session updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: ["Admin: Sessions"]
      summary: Delete a session
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/sessions/{id}/cancel:
    post:
      tags: ["Admin: Sessions"]
      summary: Cancel a session
      operationId: cancelSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelSessionRequest"
      responses:
        "200":
          description: Cancelled session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/sessions/{id}/rsvp/{userId}:
    post:
      tags: ["Admin: Sessions"]
      summary: Add or update a player's RSVP (admin override)
      description: Bypasses deadline enforcement. Flags the RSVP as added_by_admin.
      operationId: adminAddPlayerRSVP
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RSVPRequest"
      responses:
        "200":
          description: RSVP created/updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RSVP"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/club:
    put:
      tags: ["Admin: Club"]
      summary: Update club settings
      operationId: updateClub
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClubRequest"
      responses:
        "200":
          description: Updated club
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Club"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/announcements:
    post:
      tags: ["Admin: Announcements"]
      summary: Send announcement to all approved members
      operationId: sendAnnouncement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendAnnouncementRequest"
      responses:
        "201":
          description: Announcement created and sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # --- Ledger -------------------------------------------------------------

  /accounts:
    get:
      tags: [Ledger]
      summary: List every member's balance
      description: >
        Visible to all approved members. The club already worked this way in
        Splitwise and is comfortable with it. Amounts are integer cents.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Balances
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlayerBalance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /accounts/me:
    get:
      tags: [Ledger]
      summary: The caller's own balance
      description: >
        Deliberately minimal — this backs the balance chip in the header and is
        requested on nearly every screen. The state is derived server-side so
        there is one definition of "running low" rather than two that drift.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Balance and state
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance_cents:
                    type: integer
                    format: int64
                  state:
                    type: string
                    enum: [ok, low, negative]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /accounts/me/entries:
    get:
      tags: [Ledger]
      summary: The caller's own itemised history
      description: >
        Newest first. Each row carries the balance it produced, computed over the
        member's whole history and only then paged, so page two does not restart
        the arithmetic from zero.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Ledger entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/LedgerEntryView"
                  total:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/transactions/topup:
    post:
      tags: [Ledger]
      summary: Record money a member paid into the club
      description: Bank up, that member up. The club now holds their money and owes them its value.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashRequest"
      responses:
        "201":
          $ref: "#/components/responses/TransactionCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/transactions/withdrawal:
    post:
      tags: [Ledger]
      summary: Record the club paying a member back
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashRequest"
      responses:
        "201":
          $ref: "#/components/responses/TransactionCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/transactions/court-credit:
    post:
      tags: [Ledger]
      summary: Record topping up the venue account
      description: >
        Bank down, court credit up. No player balance moves — this is the club
        swapping one asset for another, which is exactly why a single club
        balance cannot answer whether the club is square.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetPurchaseRequest"
      responses:
        "201":
          $ref: "#/components/responses/TransactionCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/transactions/shuttle-purchase:
    post:
      tags: [Ledger]
      summary: Record shuttles bought
      description: >
        Both the value and the count go into stock. Buying at a new price blends
        automatically and never revalues what is already in the bag.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetPurchaseRequest"
      responses:
        "201":
          $ref: "#/components/responses/TransactionCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/transactions/opening-balances:
    post:
      tags: [Ledger]
      summary: Seed the ledger at go-live
      description: >
        Accepted once. Surplus is not supplied by the caller but computed as
        whatever makes the books balance.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpeningBalancesRequest"
      responses:
        "201":
          $ref: "#/components/responses/TransactionCreated"
        "409":
          $ref: "#/components/responses/LedgerConflict"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/transactions/{id}/reverse:
    post:
      tags: [Ledger]
      summary: Reverse a transaction
      description: >
        Posts the exact negation of the original. This is the only way to undo
        anything — there is deliberately no edit or delete endpoint, and both the
        original and its reversal stay visible.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
      responses:
        "201":
          $ref: "#/components/responses/TransactionCreated"
        "409":
          $ref: "#/components/responses/LedgerConflict"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/position:
    get:
      tags: [Ledger]
      summary: The club's true position
      description: >
        Bank, prepaid court credit and shuttle stock against what members have
        prepaid. Admin-only: balances are shared with the whole club, but what the
        club itself holds is a different question.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubPosition"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/position/integrity:
    get:
      tags: [Ledger]
      summary: Recompute the club-position identity from the entries
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Integrity report
          content:
            application/json:
              schema:
                type: object
                properties:
                  balanced: { type: boolean }
                  residual_cents: { type: integer, format: int64 }
                  entries_checked: { type: integer }
                  accounts: { type: integer }
        "403":
          $ref: "#/components/responses/Forbidden"

  # --- Settlement ---------------------------------------------------------

  /sessions/history:
    get:
      tags: [Settlement]
      summary: Sessions that have been played
      description: >
        Newest first. A finished session nobody has costed still appears, marked
        unsettled — it is exactly what the admin needs reminding about.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Past sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PastSession"
                  total:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions/{id}/settlement:
    get:
      tags: [Settlement]
      summary: What a session cost and how it was shared
      description: >
        Readable by any approved member — the people in a split are best placed to
        notice if it is wrong. Rates are the snapshot the session was costed at,
        not current club settings.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Settlement breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementView"
        "404":
          description: Not settled yet
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/sessions/{id}/settlement/preview:
    post:
      tags: [Settlement]
      summary: Cost a settlement without writing anything
      description: >
        The form calls this on every change, so the figures on screen are always
        the figures that settling will post. Omitting `lines` returns the default:
        everyone who said they were coming.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettlementRequest"
      responses:
        "200":
          description: Costed preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementPreview"
        "422":
          $ref: "#/components/responses/LedgerUnprocessable"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/sessions/{id}/settle:
    post:
      tags: [Settlement]
      summary: Settle a session
      description: >
        Draws the court cost from credit, the shuttles from stock, and charges
        each participant — in one atomic operation. Never touches the bank: that
        cash moved when members topped up and when the club bought credit and
        shuttles. Refused if the session is already settled.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettlementRequest"
      responses:
        "201":
          description: Settled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementPreview"
        "409":
          $ref: "#/components/responses/LedgerConflict"
        "422":
          $ref: "#/components/responses/LedgerUnprocessable"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/settlements/{id}/reverse:
    post:
      tags: [Settlement]
      summary: Reverse a settlement
      description: >
        Unwinds the charges, the court credit and the shuttle count, and frees the
        session to be settled again. Both the settlement and its reversal remain
        visible.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
      responses:
        "201":
          $ref: "#/components/responses/TransactionCreated"
        "409":
          $ref: "#/components/responses/LedgerConflict"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth0 JWT token

  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    TransactionCreated:
      description: Transaction written
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Transaction"
    LedgerConflict:
      description: >
        The request conflicts with what has already happened — the session is
        already settled, the transaction was already reversed, or opening
        balances have already been recorded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LedgerError"
    LedgerUnprocessable:
      description: >
        The request is well-formed but cannot be carried out — most often
        `shuttle_stock_short`, whose details carry the numbers the settlement form
        needs to offer recording the missing purchase.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LedgerError"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Message:
      description: Success message
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    Club:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        venue_name:
          type: string
        venue_address:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        auth0_id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        nickname:
          type: string
          description: >
            What the club calls this member, chosen by them or corrected by an
            admin. Displayed in place of `name` wherever it is set — member
            lists, RSVPs, balances and settlement breakdowns. When it is empty
            the display name falls back to the member's first name, so this
            being blank does not mean they show up under their full legal name.
        profile_picture:
          type: string
        phone_number:
          type: string
        role:
          type: string
          enum: [pending, player, admin]
        is_player:
          type: boolean
        membership_status:
          type: string
          enum: [pending, approved, rejected, removed]
          description: >
            `removed` is a member an admin has taken out of the club. The row is
            never deleted: RSVPs, ledger entries and settlements reference it,
            and the ledger is append-only.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        session_date:
          type: string
          format: date
        start_time:
          type: string
          description: "HH:MM format"
          example: "18:00"
        end_time:
          type: string
          description: "HH:MM format"
          example: "20:00"
        courts:
          type: integer
          minimum: 1
          maximum: 3
        max_players:
          type: integer
        rsvp_deadline:
          type: string
          format: date-time
        is_recurring:
          type: boolean
        recurring_day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          nullable: true
          description: "0=Sunday, 1=Monday, ..., 6=Saturday"
        recurring_parent_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [open, closed, cancelled]
        cancellation_reason:
          type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        rsvps:
          type: array
          items:
            $ref: "#/components/schemas/RSVP"
        creator:
          $ref: "#/components/schemas/User"

    RSVP:
      type: object
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          type: string
          description: >-
            Current RSVP state. "waitlisted" is assigned by the server when the
            session is already at capacity; clients cannot request it directly.
          enum: [in, out, maybe, waitlisted]
        waitlist_position:
          type: integer
          description: 1-based queue position. Only present while status is "waitlisted".
        rsvp_timestamp:
          type: string
          format: date-time
        is_late_rsvp:
          type: boolean
        added_by_admin:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
        session:
          $ref: "#/components/schemas/Session"

    RSVPSummary:
      type: object
      properties:
        total_in:
          type: integer
        total_out:
          type: integer
        total_maybe:
          type: integer
        total_waitlisted:
          type: integer
        max_players:
          type: integer
        spots_left:
          type: integer

    UserNotificationPreferences:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        push_enabled:
          type: boolean
        push_session_reminders:
          type: boolean
        push_rsvp_deadlines:
          type: boolean
        push_waitlist_updates:
          type: boolean
        push_admin_announcements:
          type: boolean
        email_enabled:
          type: boolean
        email_session_reminders:
          type: boolean
        email_rsvp_deadlines:
          type: boolean
        email_waitlist_updates:
          type: boolean
        email_admin_announcements:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        notification_type:
          type: string
          enum: [session_reminder, rsvp_deadline, waitlist_update, admin_announcement]
        title:
          type: string
        body:
          type: string
        data:
          type: string
          description: JSON-encoded additional payload
        push_sent:
          type: boolean
        push_sent_at:
          type: string
          format: date-time
          nullable: true
        email_sent:
          type: boolean
        email_sent_at:
          type: string
          format: date-time
          nullable: true
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Announcement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        created_by:
          type: string
          format: uuid
        sent_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        creator:
          $ref: "#/components/schemas/User"

    UpdateProfileRequest:
      type: object
      description: >
        The fields a member may change about themselves. Every field is
        optional and an omitted one is left unchanged, so the profile form can
        send only what was touched.
      properties:
        phone_number:
          type: string
        nickname:
          type: string
          maxLength: 100
          description: >
            What the club sees them under. Sending an empty string clears it,
            which falls the display name back to their first name.

    RSVPRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: >-
            Requesting "in" for a session that is already full returns an RSVP with
            status "waitlisted" instead.
          enum: [in, out, maybe]

    UpdateRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [pending, player, admin]
    InviteMemberRequest:
      type: object
      required: [email, name]
      properties:
        email:
          type: string
          format: email
          description: >
            Matched case-insensitively against the verified email at first
            sign-in, which is how the invite is claimed.
        name:
          type: string
        nickname:
          type: string
        phone_number:
          type: string
        role:
          type: string
          enum: [player, admin]
          default: player

    UpdateMemberRequest:
      type: object
      description: Every field is optional; omitted fields are left unchanged.
      properties:
        name:
          type: string
        nickname:
          type: string
        phone_number:
          type: string
        email:
          type: string
          format: email
          description: Accepted only while the member has never signed in.
        role:
          type: string
          enum: [pending, player, admin]
        is_player:
          type: boolean

    CreateSessionRequest:
      type: object
      required: [title, session_date, start_time, end_time, courts]
      properties:
        title:
          type: string
        description:
          type: string
        session_date:
          type: string
          format: date
          description: "YYYY-MM-DD"
        start_time:
          type: string
          description: "HH:MM"
          example: "18:00"
        end_time:
          type: string
          description: "HH:MM"
          example: "20:00"
        courts:
          type: integer
          minimum: 1
          maximum: 3
        is_recurring:
          type: boolean
        recurring_day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          nullable: true
        occurrences:
          type: integer
          nullable: true
          description: Number of recurring sessions to create

    UpdateSessionRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        session_date:
          type: string
          format: date
          description: "YYYY-MM-DD"
        start_time:
          type: string
          description: "HH:MM"
        end_time:
          type: string
          description: "HH:MM"
        courts:
          type: integer
          minimum: 1
          maximum: 3
        status:
          type: string
          enum: [open, closed, cancelled]

    CancelSessionRequest:
      type: object
      properties:
        reason:
          type: string

    UpdateClubRequest:
      type: object
      properties:
        name:
          type: string
        venue_name:
          type: string
        venue_address:
          type: string

    UpdatePreferencesRequest:
      type: object
      properties:
        push_enabled:
          type: boolean
        push_session_reminders:
          type: boolean
        push_rsvp_deadlines:
          type: boolean
        push_waitlist_updates:
          type: boolean
        push_admin_announcements:
          type: boolean
        email_enabled:
          type: boolean
        email_session_reminders:
          type: boolean
        email_rsvp_deadlines:
          type: boolean
        email_waitlist_updates:
          type: boolean
        email_admin_announcements:
          type: boolean

    RegisterTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
        device_name:
          type: string

    UnregisterTokenRequest:
      type: object
      properties:
        token:
          type: string
          description: If omitted, all tokens for the user are removed.

    SendAnnouncementRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
        body:
          type: string

    # --- Ledger -------------------------------------------------------------
    #
    # Every monetary field is integer cents in a `*_cents` suffix. No endpoint
    # accepts or returns a decimal for money.

    LedgerError:
      type: object
      description: >
        A domain failure with a stable machine-readable code, so the frontend can
        react to a specific condition rather than matching on message text.
      properties:
        code:
          type: string
          enum:
            - shuttle_stock_short
            - session_already_settled
            - transaction_already_reversed
            - opening_balances_already_recorded
            - not_settleable
            - invariant_violated
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    PlayerBalance:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        profile_picture: { type: string }
        balance_cents:
          type: integer
          format: int64
          description: Positive means the member is in credit; negative means they owe the club.

    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum:
            - player_topup
            - withdrawal
            - court_credit_purchase
            - shuttle_purchase
            - session_settlement
            - opening_balance
            - reversal
        session_id: { type: string, format: uuid }
        reverses_transaction_id: { type: string, format: uuid }
        description: { type: string }
        occurred_at:
          type: string
          format: date-time
          description: When the money moved in the real world; may predate created_at.
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    LedgerEntryView:
      type: object
      properties:
        id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        kind: { type: string }
        description: { type: string }
        amount_cents: { type: integer, format: int64 }
        balance_after_cents:
          type: integer
          format: int64
          description: Running balance after this entry, over the member's whole history.
        session_id: { type: string, format: uuid }
        reversed:
          type: boolean
          description: True when a later transaction reversed this one. It stays in the list either way.

    CashRequest:
      type: object
      required: [user_id, amount_cents]
      properties:
        user_id: { type: string, format: uuid }
        amount_cents: { type: integer, format: int64, minimum: 1 }
        occurred_at: { type: string, format: date-time }
        description: { type: string }

    AssetPurchaseRequest:
      type: object
      required: [amount_cents]
      properties:
        amount_cents: { type: integer, format: int64, minimum: 1 }
        units:
          type: integer
          description: Shuttles bought. Required for a shuttle purchase, ignored for court credit.
        occurred_at: { type: string, format: date-time }
        description: { type: string }

    OpeningBalancesRequest:
      type: object
      properties:
        occurred_at: { type: string, format: date-time }
        players:
          type: array
          items:
            type: object
            properties:
              user_id: { type: string, format: uuid }
              balance_cents: { type: integer, format: int64 }
        bank_cents: { type: integer, format: int64 }
        court_credit_cents: { type: integer, format: int64 }
        shuttle_stock:
          type: object
          properties:
            units: { type: integer }
            amount_cents: { type: integer, format: int64 }

    ClubPosition:
      type: object
      properties:
        assets:
          type: object
          properties:
            bank_cents: { type: integer, format: int64 }
            court_credit_cents: { type: integer, format: int64 }
            shuttle_stock_cents: { type: integer, format: int64 }
            shuttle_stock_units: { type: integer }
            total_cents: { type: integer, format: int64 }
        liabilities:
          type: object
          properties:
            player_balances_cents: { type: integer, format: int64 }
        surplus_cents: { type: integer, format: int64 }
        balanced:
          type: boolean
          description: >
            Restates the club-position identity. Always true in normal operation,
            since a posting that would falsify it is rolled back — so false means
            something wrote entries without going through the ledger service.
        warnings:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
              next_session_id: { type: string, format: uuid }

    # --- Settlement ---------------------------------------------------------

    SettlementRequest:
      type: object
      description: >
        Rates left unset fall back to club settings, so the common case is
        submitting only the participant list. Omitting `lines` entirely returns
        the default — everyone who said they were coming.
      properties:
        base_hours: { type: number }
        base_rate_cents: { type: integer, format: int64 }
        extra_hours: { type: number }
        extra_rate_cents: { type: integer, format: int64 }
        shuttles_per_hour: { type: number }
        lines:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: string
                format: uuid
                description: Whose account bears the charge. For a guest line, the host.
              guest_name:
                type: string
                description: Set to make this a guest line, counted as a head and charged to the host.
              in_base: { type: boolean }
              in_extra: { type: boolean }
              comped:
                type: boolean
                description: >
                  Still counts as a head, so no other charge moves; the waived
                  share is absorbed by club surplus.

    SettlementBand:
      type: object
      properties:
        hours: { type: number }
        court_cents: { type: integer, format: int64 }
        shuttle_units: { type: integer }
        shuttle_cents: { type: integer, format: int64 }
        total_cents: { type: integer, format: int64 }
        heads: { type: integer }

    ChargeLine:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        guest_name: { type: string }
        in_base: { type: boolean }
        in_extra: { type: boolean }
        comped: { type: boolean }
        amount_cents: { type: integer, format: int64 }

    SettlementPreview:
      type: object
      properties:
        bands:
          type: object
          properties:
            base: { $ref: "#/components/schemas/SettlementBand" }
            extra: { $ref: "#/components/schemas/SettlementBand" }
        totals:
          type: object
          properties:
            court_cents: { type: integer, format: int64 }
            shuttle_cents: { type: integer, format: int64 }
            shuttle_units: { type: integer }
            charged_cents:
              type: integer
              format: int64
              description: Equals what was consumed, less anything comped. The split is exact to the cent.
            surplus_cents: { type: integer, format: int64 }
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ChargeLine"
        stock_after:
          type: object
          properties:
            units: { type: integer }
            amount_cents: { type: integer, format: int64 }

    SettlementView:
      allOf:
        - $ref: "#/components/schemas/SettlementPreview"
        - type: object
          properties:
            session:
              type: object
              properties:
                id: { type: string, format: uuid }
                title: { type: string }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
            rates:
              type: object
              description: The snapshot this session was costed at, not current club settings.
              properties:
                base_hours: { type: number }
                base_rate_cents: { type: integer, format: int64 }
                extra_hours: { type: number }
                extra_rate_cents: { type: integer, format: int64 }
                shuttles_per_hour: { type: number }
            settled_at: { type: string, format: date-time }
            reversed_at: { type: string, format: date-time, nullable: true }

    PastSession:
      type: object
      properties:
        session_id: { type: string, format: uuid }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        settled:
          type: boolean
          description: False for a finished session nobody has costed yet. Shown rather than hidden.
        total_cents: { type: integer, format: int64 }
        player_count: { type: integer }
