name: Email Main Pipeline Failure

on:
  workflow_run:
    workflows: ["CI & Test Coverage"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      # Use trusted notification code from the default branch, never artifacts
      # or source from the failed run. This workflow has email credentials.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Email repository collaborators
        uses: actions/github-script@v8
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          CI_COLLABORATOR_EMAILS: ${{ secrets.CI_COLLABORATOR_EMAILS }}
        with:
          script: |
            const notify = require('./.github/scripts/ci-failure-email.js')
            await notify({ github, context, core })
