name: Preview Cleanup

on:
  pull_request:
    types: [closed]

jobs:
  # ============================================
  # CLEAN UP CLOUD RUN PREVIEW REVISION TAG
  # ============================================
  cleanup:
    name: Clean Up Preview Backend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.BACKEND_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Remove Cloud Run revision tag
        continue-on-error: true
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          gcloud run services update-traffic rally-club-api \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --region australia-southeast1 \
            --remove-tags pr-${PR_NUMBER}
