name: Preview Cleanup

# A merged PR used to leave its Hosting preview channel serving. The backend
# half was torn down correctly, but nothing deleted the channel, so the preview
# site stayed public until the 7-day `expires` on the deploy caught up with it.
# Both halves are handled here now, and the job verifies its own work rather
# than reporting success either way (see "Verify" below).
#
# The backend half is the Neon branch and the PR's own Cloud Run service
# (rally-club-api-pr-<n>). Previews opened before each PR had its own service
# were tagged revisions of the production service; that tag is still removed
# here when one is found.

on:
  pull_request:
    types: [closed]
  # Sweeps up anything left behind while the frontend half was missing, and is
  # the way to clear strays if a close event is ever missed.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be deleted without deleting it'
        type: boolean
        default: true

# Shares the group preview-deploy.yml uses for the same PR, so closing a PR
# cancels a preview deploy that is still running instead of racing it: a deploy
# that finished after this teardown would recreate the service and the Neon
# branch with nothing left to remove them. Manual sweeps get a group of their
# own and never cancel each other.
concurrency:
  group: preview-${{ github.event.pull_request.number || format('sweep-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: australia-southeast1
  BACKEND_SERVICE_NAME: rally-club-api
  # Meaningful on pull_request only; the sweep jobs do not use it.
  PREVIEW_SERVICE_NAME: rally-club-api-pr-${{ github.event.pull_request.number }}

jobs:
  # ============================================
  # TEAR DOWN ONE PR'S PREVIEW
  # ============================================
  cleanup:
    name: Clean Up Preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # The teardown sources .github/scripts/hosting-channels.sh, so the
      # repository has to be on disk before anything else runs.
      - uses: actions/checkout@v5

      # Delete the branch first: it is the thing that costs money if it is left
      # behind, and it is independent of anything Google Cloud does below.
      - name: Delete the PR's Neon branch
        continue-on-error: true
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: pr-${{ github.event.pull_request.number }}

      - name: Authenticate to Google Cloud (backend)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.BACKEND_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # Deleting the service takes the preview URL out of service and removes
      # every revision with it. Only NOT_FOUND counts as "already gone"; a
      # permission or network failure must not read as success.
      - name: Delete the PR's Cloud Run service
        id: service-cleanup
        continue-on-error: true
        run: |
          # This step deletes a service, so the name is checked first: it must
          # be a per-PR name and can never be the production service.
          if [[ ! "$PREVIEW_SERVICE_NAME" =~ ^rally-club-api-pr-[0-9]+$ || "$PREVIEW_SERVICE_NAME" == "$BACKEND_SERVICE_NAME" ]]; then
            echo "::error::Refusing to delete '${PREVIEW_SERVICE_NAME}': not a per-PR preview service name"
            exit 1
          fi

          diagnostic=$(mktemp)
          if gcloud run services describe "$PREVIEW_SERVICE_NAME" \
               --project "$GCP_PROJECT_ID" \
               --region "$GCP_REGION" > /dev/null 2>"$diagnostic"; then
            echo "Deleting Cloud Run service: $PREVIEW_SERVICE_NAME"
            gcloud run services delete "$PREVIEW_SERVICE_NAME" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --quiet
          elif grep -q 'NOT_FOUND' "$diagnostic"; then
            echo "Cloud Run service $PREVIEW_SERVICE_NAME does not exist; nothing to delete."
          else
            cat "$diagnostic" >&2
            exit 1
          fi

      # Transitional. A PR whose preview was deployed before previews moved to
      # their own services still holds a pr-N tag on the production service.
      # The tag is removed only when it is present, so closing any other PR
      # makes no write to production at all. Removing a tag changes no traffic
      # share. Delete this step once no such PR remains open.
      - name: Remove a legacy revision tag from the production service
        continue-on-error: true
        env:
          PR_TAG: pr-${{ github.event.pull_request.number }}
        run: |
          # Read first, on its own: through a pipeline a failed describe would
          # look the same as "no such tag".
          service_json=$(gcloud run services describe "$BACKEND_SERVICE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" --format=json)

          if jq -e --arg tag "$PR_TAG" \
               '.spec.traffic[]? | select(.tag == $tag)' <<<"$service_json" > /dev/null; then
            .github/scripts/gcloud-retry-on-conflict.sh \
              gcloud run services update-traffic "$BACKEND_SERVICE_NAME" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --remove-tags "$PR_TAG"
          else
            echo "No legacy tag ${PR_TAG} on ${BACKEND_SERVICE_NAME}."
          fi

      - name: Delete the private preview scheduler and worker
        id: worker-cleanup
        continue-on-error: true
        env:
          NOTIFICATION_WORKER_ENABLED: ${{ vars.NOTIFICATION_WORKER_ENABLED }}
          NOTIFICATION_WORKER_SERVICE: rally-notifications-pr-${{ github.event.pull_request.number }}
          NOTIFICATION_SCHEDULER_EMAIL: ${{ vars.NOTIFICATION_SCHEDULER_EMAIL }}
        run: bash .github/scripts/notification-worker.sh cleanup

      # Checked here, while the backend identity is still active: it is the one
      # that deploys and deletes these services, so it can certainly read them.
      # The final "Verify" step runs as the frontend identity and only reads
      # this step's outcome.
      - name: Verify the Cloud Run preview is gone
        id: cloud-run-verify
        continue-on-error: true
        env:
          PR_TAG: pr-${{ github.event.pull_request.number }}
        run: |
          failed=0

          # The service must be positively absent: describe has to fail, and
          # with NOT_FOUND. Any other failure proves nothing about the service.
          diagnostic=$(mktemp)
          if gcloud run services describe "$PREVIEW_SERVICE_NAME" \
               --project "$GCP_PROJECT_ID" \
               --region "$GCP_REGION" > /dev/null 2>"$diagnostic"; then
            echo "::error::Cloud Run service ${PREVIEW_SERVICE_NAME} still exists"
            failed=1
          elif ! grep -q 'NOT_FOUND' "$diagnostic"; then
            echo "::error::Could not confirm Cloud Run service ${PREVIEW_SERVICE_NAME} is gone"
            cat "$diagnostic" >&2
            failed=1
          fi

          # Legacy previews only: the pr-N tag on the production service.
          if ! service_json=$(gcloud run services describe "$BACKEND_SERVICE_NAME" \
                 --project "$GCP_PROJECT_ID" \
                 --region "$GCP_REGION" --format=json); then
            echo "::error::Could not read ${BACKEND_SERVICE_NAME} to check for a legacy ${PR_TAG} tag"
            failed=1
          elif jq -e --arg tag "$PR_TAG" \
                 '.spec.traffic[]? | select(.tag == $tag)' <<<"$service_json" > /dev/null; then
            echo "::error::Legacy Cloud Run tag ${PR_TAG} is still attached to ${BACKEND_SERVICE_NAME}"
            failed=1
          fi

          exit $failed

      # A second identity: Hosting is deployed by the frontend service account,
      # so it is the one that may delete what it created.
      - name: Authenticate to Google Cloud (frontend)
        id: frontend-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.FRONTEND_SA_EMAIL }}
          create_credentials_file: true

      - name: Delete the PR's Hosting preview channel
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.frontend-auth.outputs.credentials_file_path }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          npm install -g firebase-tools@13
          source .github/scripts/hosting-channels.sh

          channels=$(list_channels) || {
            echo "::error::could not list Hosting channels"
            exit 1
          }

          # The channel id is derived from the branch name and truncated to fit,
          # so it is matched by its pr-number prefix rather than rebuilt here.
          for channel in $channels; do
            if channel_belongs_to_pr "$channel" "$PR_NUMBER"; then
              echo "Deleting Hosting preview channel: $channel"
              delete_channel "$channel"
            fi
          done

      # Without this the job is green whether or not anything was torn down —
      # which is exactly how the missing Hosting step went unnoticed. Every step
      # above tolerates "already gone"; this one insists the end state is right.
      - name: Verify the preview is gone
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.frontend-auth.outputs.credentials_file_path }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          source .github/scripts/hosting-channels.sh
          failed=0
          if [[ '${{ steps.worker-cleanup.outcome }}' == 'failure' ]]; then
            echo '::error::Private worker cleanup failed; public cleanup has still been attempted.'
            failed=1
          fi

          if [[ '${{ steps.service-cleanup.outcome }}' == 'failure' ]]; then
            echo '::error::Cloud Run preview service cleanup failed; the rest of the teardown has still been attempted.'
            failed=1
          fi

          # Anything but "success" fails: a step that was skipped or cancelled
          # verified nothing.
          if [[ '${{ steps.cloud-run-verify.outcome }}' != 'success' ]]; then
            echo "::error::The Cloud Run preview for PR #${PR_NUMBER} was not confirmed gone; see the 'Verify the Cloud Run preview is gone' step."
            failed=1
          fi

          channels=$(list_channels) || {
            echo "::error::could not list Hosting channels to verify against"
            exit 1
          }
          for channel in $channels; do
            if channel_belongs_to_pr "$channel" "$PR_NUMBER"; then
              echo "::error::Hosting preview channel ${channel} is still serving"
              failed=1
            fi
          done

          if [ "$failed" -eq 0 ]; then
            echo "Preview for PR #${PR_NUMBER} is fully torn down."
          fi
          exit $failed

  # ============================================
  # SWEEP UP PREVIEWS FOR PRS THAT ARE ALREADY CLOSED
  # ============================================
  sweep:
    name: Sweep Closed-PR Previews
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        id: frontend-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.FRONTEND_SA_EMAIL }}
          create_credentials_file: true

      - name: Delete Hosting preview channels for closed PRs
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.frontend-auth.outputs.credentials_file_path }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          npm install -g firebase-tools@13
          source .github/scripts/hosting-channels.sh

          channels=$(list_channels) || {
            echo "::error::could not list Hosting channels"
            exit 1
          }

          swept=0
          for channel in $channels; do
            pr=$(pr_number_for_channel "$channel") || continue
            if [ -z "$pr" ]; then
              echo "Skipping ${channel}: not a PR preview channel"
              continue
            fi

            state=$(gh pr view "$pr" --json state -q .state 2>/dev/null || echo "UNKNOWN")
            if [ "$state" = "OPEN" ]; then
              echo "Keeping ${channel}: PR #${pr} is still open"
              continue
            fi

            swept=$((swept + 1))
            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry run] would delete ${channel} (PR #${pr} is ${state})"
            else
              echo "Deleting ${channel} (PR #${pr} is ${state})"
              delete_channel "$channel"
            fi
          done

          echo "${swept} channel(s) matched." >> "$GITHUB_STEP_SUMMARY"

  # ============================================
  # SWEEP UP PREVIEW SERVICES FOR PRS THAT ARE ALREADY CLOSED
  # ============================================
  # A separate job, not more steps in the one above: the services belong to the
  # backend identity and the channels to the frontend one, and neither sweep
  # should be skipped because the other failed.
  sweep-services:
    name: Sweep Closed-PR Preview Services
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud (backend)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.BACKEND_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Delete Cloud Run preview services for closed PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          services=$(gcloud run services list \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(metadata.name)')

          swept=0
          for service in $services; do
            # Only per-PR preview names are ever candidates. The production
            # service and the notification workers do not match.
            if [[ ! "$service" =~ ^rally-club-api-pr-([0-9]+)$ ]]; then
              continue
            fi
            pr="${BASH_REMATCH[1]}"

            # Delete on positive evidence only. If the PR's state cannot be
            # read, the service stays.
            if ! state=$(gh pr view "$pr" --json state -q .state); then
              echo "::warning::Keeping ${service}: could not read the state of PR #${pr}"
              continue
            fi
            if [[ "$state" != "CLOSED" && "$state" != "MERGED" ]]; then
              echo "Keeping ${service}: PR #${pr} is ${state}"
              continue
            fi

            swept=$((swept + 1))
            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry run] would delete ${service} (PR #${pr} is ${state})"
            else
              echo "Deleting ${service} (PR #${pr} is ${state})"
              gcloud run services delete "$service" \
                --project "$GCP_PROJECT_ID" \
                --region "$GCP_REGION" \
                --quiet
            fi
          done

          echo "${swept} preview service(s) matched." >> "$GITHUB_STEP_SUMMARY"
