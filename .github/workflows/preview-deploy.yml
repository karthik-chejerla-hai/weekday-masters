name: Dev deployment guidance

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dev-guidance:
    runs-on: ubuntu-latest
    steps:
      - name: Explain isolated dev testing
        run: |
          echo '### Test in the separate dev environment' >> "$GITHUB_STEP_SUMMARY"
          echo 'PR checks run automatically. Use Actions > Dev then prod, select workflow branch main, and set source_ref to your branch or commit. See DEV.md. This workflow does not access production services or copy production data.' >> "$GITHUB_STEP_SUMMARY"
