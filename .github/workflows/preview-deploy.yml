name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: australia-southeast1
  ARTIFACT_REGISTRY_REPO: rally-club-api-registry
  BACKEND_SERVICE_NAME: rally-club-api
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

jobs:
  # ============================================
  # DEPLOY PREVIEW BACKEND TO CLOUD RUN
  # ============================================
  deploy-preview-backend:
    name: Deploy Preview Backend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.BACKEND_SA_EMAIL }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push Docker image
        working-directory: backend
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.BACKEND_SERVICE_NAME }}:pr-${PR_NUMBER}-${SHA}"
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run (no traffic, tagged revision)
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          # Previews and the production deploy all write to the same service, so
          # overlapping runs lose an optimistic-concurrency race. See the script.
          .github/scripts/gcloud-retry-on-conflict.sh \
            gcloud run deploy ${{ env.BACKEND_SERVICE_NAME }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --image ${{ env.IMAGE }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --no-traffic \
            --tag pr-${PR_NUMBER} \
            --allow-unauthenticated \
            --set-env-vars="GIN_MODE=release" \
            --set-env-vars="TIMEZONE=Australia/Sydney" \
            --set-env-vars="FRONTEND_URL=*" \
            --set-env-vars="AUTH0_DOMAIN=${{ secrets.AUTH0_DOMAIN }}" \
            --set-env-vars="AUTH0_AUDIENCE=${{ secrets.AUTH0_AUDIENCE }}" \
            --set-env-vars="ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}" \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars="FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" \
            --set-env-vars="SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}" \
            --set-env-vars="SENDGRID_FROM_EMAIL=${{ secrets.SENDGRID_FROM_EMAIL }}" \
            --set-env-vars="SENDGRID_FROM_NAME=Rally" \
            --set-env-vars="SESSION_REMINDER_HOURS_24=24" \
            --set-env-vars="SESSION_REMINDER_HOURS_12=12" \
            --set-env-vars="DEADLINE_REMINDER_HOURS=6"

      # Smoke check only. The URL is deliberately NOT exported as a job output: the
      # frontend job resolves it itself at build time, because passing it between
      # jobs ran it through secret masking and produced an empty VITE_API_URL.
      - name: Verify preview backend URL resolves
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE_NAME }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --region ${{ env.GCP_REGION }} \
            --format=json | jq -r --arg tag "pr-${PR_NUMBER}" \
              '.status.traffic[] | select(.tag == $tag) | .url')

          if [ -z "$URL" ]; then
            echo "::error::Could not resolve the tagged preview URL for pr-${PR_NUMBER}"
            exit 1
          fi

          echo "Preview backend deployed to: $URL"

  # ============================================
  # DEPLOY PREVIEW FRONTEND TO FIREBASE HOSTING
  # ============================================
  deploy-preview-frontend:
    name: Deploy Preview Frontend
    runs-on: ubuntu-latest
    needs: deploy-preview-backend

    permissions:
      contents: read
      pull-requests: write
      checks: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.FRONTEND_SA_EMAIL }}
          create_credentials_file: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # 22, matching ci.yml: Node 20 went EOL in April 2026, and building
          # the deployed bundle on a different major than the one it is tested
          # on is a difference waiting to matter.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_PROJECT_ID }}.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_PROJECT_ID }}.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
        run: |
          # Resolve the tagged revision URL here rather than reading it from a job
          # output — see the same fix in deploy.yml (785f14c).
          PR_NUMBER=${{ github.event.pull_request.number }}
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE_NAME }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --region ${{ env.GCP_REGION }} \
            --format=json | jq -r --arg tag "pr-${PR_NUMBER}" \
              '.status.traffic[] | select(.tag == $tag) | .url')

          # Fail loudly: an empty value silently falls back to a relative "/api",
          # which Firebase's SPA rewrite answers with index.html, so every API call
          # returns HTML and login breaks with no obvious cause.
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::Preview backend URL is empty for pr-${PR_NUMBER}; refusing to build a frontend that cannot reach its API"
            exit 1
          fi

          export VITE_API_URL="${BACKEND_URL}/api"
          echo "Building with VITE_API_URL=${VITE_API_URL}"
          npm run build

      - name: Read WIF credentials
        id: creds
        run: echo "json=$(cat '${{ steps.auth.outputs.credentials_file_path }}')" >> $GITHUB_OUTPUT

      - name: Deploy to Firebase Hosting (preview channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ steps.creds.outputs.json }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          entryPoint: frontend
          expires: 7d
