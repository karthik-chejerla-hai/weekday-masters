name: CI Backend

on:
  # No paths filter on main: every push must refresh the status badge, otherwise a
  # broken main keeps showing the last green run from whenever these paths changed.
  push:
    branches: [main]
  pull_request:
    paths: [backend/**]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go mod download
        working-directory: backend
      - run: go build ./cmd/server/
        working-directory: backend
