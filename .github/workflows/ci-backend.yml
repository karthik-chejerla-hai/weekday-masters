name: CI Backend

on:
  push:
    branches: [main]
    paths: [backend/**]
  pull_request:
    paths: [backend/**]

jobs:
  build:
    runs-on: ubuntu-latest

    # Scratch database for the capacity/waitlist tests. They exercise real
    # transactions and row locks, so they need a live PostgreSQL.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: badminton
          POSTGRES_PASSWORD: badminton123
          POSTGRES_DB: badminton_club_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum
      - run: go mod download
        working-directory: backend
      - run: go build ./...
        working-directory: backend
      - name: Test
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://badminton:badminton123@localhost:5432/badminton_club_test?sslmode=disable
        run: go test -race ./...
