name: Deploy

on:
  workflow_call:
    inputs:
      image-digest:
        description: Published backend image digest from the successful build job
        required: true
        type: string

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: australia-southeast1
  ARTIFACT_REGISTRY_REPO: rally-club-api-registry
  BACKEND_SERVICE_NAME: rally-club-api
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

jobs:
  # ============================================
  # DEPLOY BACKEND TO CLOUD RUN
  # ============================================
  deploy-backend:
    name: Deploy Backend
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    # Keep deployment history without manual approval. In repository settings,
    # production-api permits main and has no required reviewers or wait timer.
    environment:
      name: production-api
      url: ${{ steps.backend-url.outputs.url }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Verify notification queue deployment readiness
        env:
          NOTIFICATIONS_DISABLED: ${{ vars.NOTIFICATIONS_DISABLED || 'true' }}
          NOTIFICATION_WORKER_ENABLED: ${{ vars.NOTIFICATION_WORKER_ENABLED || 'false' }}
        run: |
          if [[ "$NOTIFICATIONS_DISABLED" == "false" && "$NOTIFICATION_WORKER_ENABLED" != "true" ]]; then
            echo '::error::Provision the private notification worker before enabling delivery. Stopped staging requires NOTIFICATIONS_DISABLED=true.'
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.BACKEND_SA_EMAIL }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Select published backend image
        env:
          IMAGE_DIGEST: ${{ inputs.image-digest }}
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::A valid published backend image digest is required"
            exit 1
          fi
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${BACKEND_SERVICE_NAME}@${IMAGE_DIGEST}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"

      # Run the migration binary from the exact image deployed below.
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: docker run --rm -e DATABASE_URL "$IMAGE" ./migrate

      - name: Deploy private notification worker
        if: vars.NOTIFICATION_WORKER_ENABLED == 'true'
        env:
          IMAGE: ${{ env.IMAGE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NOTIFICATION_WORKER_SERVICE: rally-notifications
          NOTIFICATION_WORKER_AUDIENCE: https://rally.internal/notifications/production
          NOTIFICATION_WORKER_RUNTIME_EMAIL: ${{ vars.NOTIFICATION_WORKER_RUNTIME_EMAIL }}
          NOTIFICATION_SCHEDULER_EMAIL: ${{ vars.NOTIFICATION_SCHEDULER_EMAIL }}
          NOTIFICATIONS_DISABLED: ${{ vars.NOTIFICATIONS_DISABLED || 'true' }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: bash .github/scripts/notification-worker.sh deploy

      # The release names its own revision instead of asking Cloud Run which one
      # is "latest" afterwards. "Latest" is a property of the service, not of
      # this run: any other writer (an overlapping release, a manual deploy, and
      # formerly every PR preview) can move it between two of our steps. A name
      # built from the commit, the run and the attempt belongs to this job alone,
      # so every later step, and every retry of one, refers to the same revision.
      - name: Name the production revision
        run: |
          REVISION_SUFFIX="r${GITHUB_SHA::7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REVISION="${BACKEND_SERVICE_NAME}-${REVISION_SUFFIX}"
          if [[ ! "$REVISION" =~ ^[a-z][a-z0-9-]{0,61}[a-z0-9]$ ]]; then
            echo "::error::Derived revision name '${REVISION}' is not a valid Cloud Run revision name"
            exit 1
          fi
          echo "REVISION_SUFFIX=$REVISION_SUFFIX" >> "$GITHUB_ENV"
          echo "REVISION=$REVISION" >> "$GITHUB_ENV"
          echo "Production revision for this release: $REVISION"

      # --no-traffic: creating the revision and serving from it are separate
      # steps, with a verification between them. Production keeps serving the
      # previous revision until "Route traffic" below names this one.
      - name: Deploy to Cloud Run (no traffic)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Overlapping writes to the service (another release, a legacy tag
          # cleanup) lose an optimistic-concurrency race. See the script. A
          # rejected write creates no revision, so a retry reuses the same
          # --revision-suffix and still produces exactly $REVISION.
          .github/scripts/gcloud-retry-on-conflict.sh \
            gcloud run deploy ${{ env.BACKEND_SERVICE_NAME }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --image "$IMAGE" \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --no-traffic \
            --revision-suffix "$REVISION_SUFFIX" \
            --cpu-throttling \
            --min 0 \
            --min-instances 0 \
            --allow-unauthenticated \
            --update-env-vars="NOTIFICATION_WORKER_ENABLED=${{ vars.NOTIFICATION_WORKER_ENABLED || 'false' }}" \
            --update-env-vars="OTEL_ENABLED=false" \
            --remove-env-vars="SESSION_REMINDER_HOURS_24,SESSION_REMINDER_HOURS_12,DEADLINE_REMINDER_HOURS,OTEL_SERVICE_NAME,OTEL_RESOURCE_ATTRIBUTES,OTEL_EXPORTER_OTLP_ENDPOINT,OTEL_EXPORTER_OTLP_TIMEOUT,OTEL_METRIC_EXPORT_INTERVAL" \
            --remove-secrets="OTEL_EXPORTER_OTLP_HEADERS" \
            --update-env-vars="GIN_MODE=release" \
            --update-env-vars="NOTIFICATIONS_DISABLED=${{ vars.NOTIFICATIONS_DISABLED || 'true' }}" \
            --update-env-vars="INVITATION_TEST_EMAILS_ENABLED=${{ vars.INVITATION_TEST_EMAILS_ENABLED || 'false' }}" \
            --update-env-vars="TIMEZONE=Australia/Sydney" \
            --update-env-vars="FRONTEND_URL=${{ secrets.FRONTEND_URL }}" \
            --update-env-vars="AUTH0_DOMAIN=${{ secrets.AUTH0_DOMAIN }}" \
            --update-env-vars="AUTH0_AUDIENCE=${{ secrets.AUTH0_AUDIENCE }}" \
            --update-env-vars="ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}" \
            --update-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --update-env-vars="GROQ_API_KEY=${GROQ_API_KEY}" \
            --update-env-vars="FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" \
            --update-env-vars="SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}" \
            --update-env-vars="SENDGRID_FROM_EMAIL=${{ secrets.SENDGRID_FROM_EMAIL }}" \
            --update-env-vars="SENDGRID_FROM_NAME=Rally"

      # Nothing is routed on trust. Before any traffic moves, the named revision
      # must exist, belong to the production service, be ready, and run the
      # exact image digest the build job published. A failure here leaves
      # production on the previous revision.
      - name: Verify the revision runs the published image
        run: |
          revision_json=$(gcloud run revisions describe "$REVISION" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json)

          owner=$(jq -r '.metadata.labels["serving.knative.dev/service"] // ""' <<<"$revision_json")
          spec_image=$(jq -r '.spec.containers[0].image // ""' <<<"$revision_json")
          resolved_image=$(jq -r '.status.imageDigest // ""' <<<"$revision_json")
          ready=$(jq -r '[.status.conditions[]? | select(.type == "Ready") | .status][0] // ""' <<<"$revision_json")

          failed=0
          if [[ "$owner" != "$BACKEND_SERVICE_NAME" ]]; then
            echo "::error::Revision ${REVISION} belongs to service '${owner}', not ${BACKEND_SERVICE_NAME}"
            failed=1
          fi
          if [[ "$spec_image" != "$IMAGE" ]]; then
            echo "::error::Revision ${REVISION} was not created from the image this workflow deployed"
            failed=1
          fi
          # status.imageDigest is what Cloud Run actually resolved and runs.
          if [[ "$resolved_image" != *@* || "${resolved_image##*@}" != "$IMAGE_DIGEST" ]]; then
            echo "::error::Revision ${REVISION} runs digest '${resolved_image##*@}', expected ${IMAGE_DIGEST}"
            failed=1
          fi
          if [[ "$ready" != "True" ]]; then
            echo "::error::Revision ${REVISION} is not ready (Ready=${ready:-unknown})"
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::Refusing to route production traffic; the previous revision keeps serving."
            exit 1
          fi
          echo "Verified ${REVISION} runs ${IMAGE_DIGEST}"

      # Never --to-latest: that routes to whichever revision is latest when the
      # command lands, not to the one this run deployed and verified. The
      # revision is named, so each retry after a conflict routes to the same one.
      - name: Route traffic to the verified revision
        run: |
          .github/scripts/gcloud-retry-on-conflict.sh \
            gcloud run services update-traffic "$BACKEND_SERVICE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-revisions "${REVISION}=100"

      - name: Confirm production serves only the verified revision
        run: |
          # Every traffic target with a share must be this revision, pinned by
          # name. A "latest revision" target would reopen the race on the next
          # write to the service, so it fails the release even at 100%.
          if ! gcloud run services describe "$BACKEND_SERVICE_NAME" \
                 --project "$GCP_PROJECT_ID" \
                 --region "$GCP_REGION" \
                 --format=json \
               | jq -e --arg revision "$REVISION" '
                   [.spec.traffic[]? | select((.percent // 0) > 0)]
                   | length == 1
                     and .[0].percent == 100
                     and .[0].revisionName == $revision
                     and (.[0].latestRevision // false) == false
                 ' > /dev/null; then
            echo "::error::Production traffic is not pinned 100% to ${REVISION}"
            exit 1
          fi
          echo "Production traffic is pinned 100% to ${REVISION}"

      - name: Get Backend URL
        id: backend-url
        run: |
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE_NAME }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --region ${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Backend deployed to: $URL"

    outputs:
      backend-url: ${{ steps.backend-url.outputs.url }}

  # ============================================
  # DEPLOY FRONTEND TO FIREBASE HOSTING
  # ============================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend # Wait for backend to get URL

    environment:
      name: production-web
      url: https://rally-club-app.web.app

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.FRONTEND_SA_EMAIL }}
          create_credentials_file: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # 22, matching ci.yml: Node 20 went EOL in April 2026, and building
          # the deployed bundle on a different major than the one it is tested
          # on is a difference waiting to matter.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          # Auth0
          VITE_AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
          # Firebase (for push notifications)
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_PROJECT_ID }}.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_PROJECT_ID }}.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
        run: |
          # Fetch backend URL directly via gcloud to avoid GitHub secret masking on job outputs
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE_NAME }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --region ${{ env.GCP_REGION }} \
            --format='value(status.url)')
          export VITE_API_URL="${BACKEND_URL}/api"
          echo "Building with VITE_API_URL=${VITE_API_URL}"
          npm run build

      - name: Read WIF credentials
        id: creds
        run: echo "json=$(cat '${{ steps.auth.outputs.credentials_file_path }}')" >> "$GITHUB_OUTPUT"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ steps.creds.outputs.json }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: frontend
