name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: australia-southeast1
  ARTIFACT_REGISTRY_REPO: rally-club-api-registry
  BACKEND_SERVICE_NAME: rally-club-api
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

jobs:
  # ============================================
  # DEPLOY BACKEND TO CLOUD RUN
  # ============================================
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest

    # Recording this as a GitHub Deployment gives the repo an Environments panel and
    # per-commit deploy status. No protection rules are set here — add required
    # reviewers under Settings -> Environments if you want an approval gate.
    environment:
      name: production-api
      url: ${{ steps.backend-url.outputs.url }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Verify notification queue deployment readiness
        env:
          NOTIFICATIONS_DISABLED: ${{ vars.NOTIFICATIONS_DISABLED || 'true' }}
          NOTIFICATION_WORKER_ENABLED: ${{ vars.NOTIFICATION_WORKER_ENABLED || 'false' }}
        run: |
          if [[ "$NOTIFICATIONS_DISABLED" == "false" && "$NOTIFICATION_WORKER_ENABLED" != "true" ]]; then
            echo '::error::Provision the private notification worker before enabling delivery. Stopped staging requires NOTIFICATIONS_DISABLED=true.'
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.BACKEND_SA_EMAIL }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push Docker image
        working-directory: backend
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.BACKEND_SERVICE_NAME }}:${{ github.sha }}"
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      # Schema is applied here, as an explicit step, rather than on server startup —
      # that avoids concurrent Cloud Run revisions racing to migrate.
      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: go run ./cmd/migrate

      - name: Deploy private notification worker
        if: vars.NOTIFICATION_WORKER_ENABLED == 'true'
        env:
          IMAGE: ${{ env.IMAGE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NOTIFICATION_WORKER_SERVICE: rally-notifications
          NOTIFICATION_WORKER_AUDIENCE: https://rally.internal/notifications/production
          NOTIFICATION_WORKER_RUNTIME_EMAIL: ${{ vars.NOTIFICATION_WORKER_RUNTIME_EMAIL }}
          NOTIFICATION_SCHEDULER_EMAIL: ${{ vars.NOTIFICATION_SCHEDULER_EMAIL }}
          NOTIFICATIONS_DISABLED: ${{ vars.NOTIFICATIONS_DISABLED || 'true' }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: bash .github/scripts/notification-worker.sh deploy

      - name: Deploy to Cloud Run
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OTEL_ENABLED: ${{ vars.OTEL_ENABLED || 'false' }}
          OTEL_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_HEADERS_SECRET: ${{ vars.OTEL_HEADERS_SECRET }}
        run: |
          telemetry_flags=(--set-env-vars="OTEL_ENABLED=${OTEL_ENABLED}")
          if [[ "$OTEL_ENABLED" == "true" ]]; then
            if [[ -z "$OTEL_ENDPOINT" || -z "$OTEL_HEADERS_SECRET" ]]; then
              echo "OTEL requires OTEL_EXPORTER_OTLP_ENDPOINT and OTEL_HEADERS_SECRET repository variables" >&2
              exit 1
            fi
            telemetry_flags+=(
              --set-env-vars="OTEL_SERVICE_NAME=rally-api"
              --set-env-vars="OTEL_RESOURCE_ATTRIBUTES=deployment.environment.name=production"
              --set-env-vars="OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_ENDPOINT}"
              --set-env-vars="OTEL_EXPORTER_OTLP_TIMEOUT=3000"
              --set-env-vars="OTEL_METRIC_EXPORT_INTERVAL=30000"
              --update-secrets="OTEL_EXPORTER_OTLP_HEADERS=${OTEL_HEADERS_SECRET}:latest"
              --no-cpu-throttling
            )
          fi
          # A preview deploy on an open PR writes to this same service, so this
          # can lose an optimistic-concurrency race. See the script.
          .github/scripts/gcloud-retry-on-conflict.sh \
            gcloud run deploy ${{ env.BACKEND_SERVICE_NAME }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --image ${{ env.IMAGE }} \
            --region ${{ env.GCP_REGION }} \
            "${telemetry_flags[@]}" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars="GIN_MODE=release" \
            --set-env-vars="NOTIFICATIONS_DISABLED=${{ vars.NOTIFICATIONS_DISABLED || 'true' }}" \
            --set-env-vars="NOTIFICATION_WORKER_ENABLED=${{ vars.NOTIFICATION_WORKER_ENABLED || 'false' }}" \
            --set-env-vars="INVITATION_TEST_EMAILS_ENABLED=${{ vars.INVITATION_TEST_EMAILS_ENABLED || 'false' }}" \
            --set-env-vars="TIMEZONE=Australia/Sydney" \
            --set-env-vars="FRONTEND_URL=${{ secrets.FRONTEND_URL }}" \
            --set-env-vars="AUTH0_DOMAIN=${{ secrets.AUTH0_DOMAIN }}" \
            --set-env-vars="AUTH0_AUDIENCE=${{ secrets.AUTH0_AUDIENCE }}" \
            --set-env-vars="ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}" \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars="GROQ_API_KEY=${GROQ_API_KEY}" \
            --set-env-vars="FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" \
            --set-env-vars="SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}" \
            --set-env-vars="SENDGRID_FROM_EMAIL=${{ secrets.SENDGRID_FROM_EMAIL }}" \
            --set-env-vars="SENDGRID_FROM_NAME=Rally" \
            --set-env-vars="SESSION_REMINDER_HOURS_24=24" \
            --set-env-vars="SESSION_REMINDER_HOURS_12=12" \
            --set-env-vars="DEADLINE_REMINDER_HOURS=6"

      - name: Route traffic to latest revision
        run: |
          .github/scripts/gcloud-retry-on-conflict.sh \
            gcloud run services update-traffic ${{ env.BACKEND_SERVICE_NAME }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --region ${{ env.GCP_REGION }} \
            --to-latest

      - name: Get Backend URL
        id: backend-url
        run: |
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE_NAME }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --region ${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Backend deployed to: $URL"

    outputs:
      backend-url: ${{ steps.backend-url.outputs.url }}

  # ============================================
  # DEPLOY FRONTEND TO FIREBASE HOSTING
  # ============================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend # Wait for backend to get URL

    environment:
      name: production-web
      url: https://rally-club-app.web.app

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.FRONTEND_SA_EMAIL }}
          create_credentials_file: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # 22, matching ci.yml: Node 20 went EOL in April 2026, and building
          # the deployed bundle on a different major than the one it is tested
          # on is a difference waiting to matter.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          # Auth0
          VITE_AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
          # Firebase (for push notifications)
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_PROJECT_ID }}.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_PROJECT_ID }}.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
        run: |
          # Fetch backend URL directly via gcloud to avoid GitHub secret masking on job outputs
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE_NAME }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --region ${{ env.GCP_REGION }} \
            --format='value(status.url)')
          export VITE_API_URL="${BACKEND_URL}/api"
          echo "Building with VITE_API_URL=${VITE_API_URL}"
          npm run build

      - name: Read WIF credentials
        id: creds
        run: echo "json=$(cat '${{ steps.auth.outputs.credentials_file_path }}')" >> $GITHUB_OUTPUT

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ steps.creds.outputs.json }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: frontend
