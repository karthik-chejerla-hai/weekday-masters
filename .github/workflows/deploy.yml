name: Dev then prod

on:
  push:
    branches: [main, feat/development-environment]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or commit to test in dev
        default: main
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rally_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: rally_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test release safeguards
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Backend tests with database
        working-directory: backend
        env:
          MIN_COVERAGE: '60'
          TEST_DATABASE_URL: postgres://rally_test:test_only@localhost:5432/rally_test?sslmode=disable
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out > coverage-summary.txt
          ../.github/scripts/check-go-coverage.sh coverage-summary.txt
      - name: Frontend checks and browser tests
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npm run test:coverage
          npm run test:e2e:typecheck
          npx playwright install --with-deps chromium
          npm run test:e2e

  dev:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://rally-club-app-dev.web.app
    concurrency:
      group: rally-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_ENV: dev
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
      GCP_PROJECT_ID: rally-club-app-dev
      WIF_PROVIDER: ${{ vars.DEV_WIF_PROVIDER }}
      DEPLOYER_SA: rally-dev-deployer@rally-club-app-dev.iam.gserviceaccount.com
      RUNTIME_SA: rally-dev-runtime@rally-club-app-dev.iam.gserviceaccount.com
      NOTIFICATION_SCHEDULER_EMAIL: rally-dev-scheduler@rally-club-app-dev.iam.gserviceaccount.com
      WORKER_RUNTIME_SA: rally-dev-runtime@rally-club-app-dev.iam.gserviceaccount.com
      AUTH0_DOMAIN: ${{ vars.DEV_AUTH0_DOMAIN }}
      AUTH0_CLIENT_ID: ${{ vars.DEV_AUTH0_CLIENT_ID }}
      AUTH0_AUDIENCE: ${{ vars.DEV_AUTH0_AUDIENCE }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      FIREBASE_API_KEY: ${{ vars.DEV_FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ vars.DEV_FIREBASE_APP_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.DEV_FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_VAPID_KEY: ${{ vars.DEV_FIREBASE_VAPID_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: ./.github/actions/release
      - uses: actions/upload-artifact@v6
        with:
          name: dev-release
          path: |
            /tmp/rally-image.tar.gz
            /tmp/release.json
          retention-days: 30
      - name: Explain approval
        run: echo 'Test this dev release. Approve the prod job in this run only when tests pass. Branch tests do not release to prod.' >> "$GITHUB_STEP_SUMMARY"

  prod:
    needs: [verify, dev]
    # A feature workflow can deploy dev, but cannot obtain production credentials.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://rally-club-app.web.app
    concurrency:
      group: rally-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_ENV: prod
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
      GCP_PROJECT_ID: rally-club-app
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      DEPLOYER_SA: ${{ secrets.BACKEND_SA_EMAIL }}
      FRONTEND_SA: ${{ secrets.FRONTEND_SA_EMAIL }}
      RUNTIME_SA: 917685310381-compute@developer.gserviceaccount.com
      NOTIFICATION_SCHEDULER_EMAIL: ${{ vars.NOTIFICATION_SCHEDULER_EMAIL }}
      WORKER_RUNTIME_SA: ${{ vars.NOTIFICATION_WORKER_RUNTIME_EMAIL }}
      NOTIFICATIONS_DISABLED: ${{ vars.NOTIFICATIONS_DISABLED || 'true' }}
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
      - name: Require source from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - uses: actions/download-artifact@v7
        with:
          name: dev-release
          path: /tmp/dev-release
      - name: Check that dev still runs this release
        run: python3 scripts/release/identity.py verify /tmp/dev-release/release.json
      - uses: ./.github/actions/release
        with:
          database_url: ${{ secrets.DATABASE_URL }}
          groq_api_key: ${{ secrets.GROQ_API_KEY }}
          sendgrid_api_key: ${{ secrets.SENDGRID_API_KEY }}
          sendgrid_from_email: ${{ secrets.SENDGRID_FROM_EMAIL }}
