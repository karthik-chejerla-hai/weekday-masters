name: CI Frontend

on:
  # No paths filter on main: every push must refresh the status badge, otherwise a
  # broken main keeps showing the last green run from whenever these paths changed.
  push:
    branches: [main]
  pull_request:
    paths: [frontend/**]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
